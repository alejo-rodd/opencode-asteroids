name: issue-triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode triage
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/minimax-m3
          prompt: |
            Eres un bot de triage para issues recién abiertos en este repositorio.
            Tu trabajo es organizar el issue para que sea más fácil de revisar,
            SIN modificar nada de lo que el autor escribió.

            Labels permitidas (créala si no existe; color sugerido entre paréntesis):
              - `bug` (#d73a4a): bug, falla, error, crash, broken, no funciona
              - `enhancement` (#a2eeef): feature, solicitud, request, idea, sugerencia
              - `documentation` (#0075ca): doc(s), readme, typo, documentación
              - `question` (#cc317c): pregunta, ayuda, cómo, how to, question

            Pasos:
            1. Lee el título y el cuerpo del issue.
            2. Detecta qué labels aplican (cero o más). Usa `create_label` si una
               label no existe, y luego `add_labels`.
            3. Añade al FINAL del cuerpo del issue el siguiente footer (NO modifiques
               el texto original del autor arriba). Usa un separador `---` entre el
               cuerpo original y el footer:
                 ## Pasos para reproducir     (solo si no existe ya como ## heading)
                 ## Comportamiento esperado   (solo si no existe ya)
                 ## Comportamiento observado  (solo si no existe ya)
                 ## Entorno                   (solo si no existe ya)
                 ## Issue Metadata
                   - Autor: @<login>
                   - Fecha de creación: <timestamp ISO>
                   - Labels aplicadas por el bot: <separadas por coma, o "ninguna">
                 ## Archivos referenciados     (solo si el body menciona archivos del repo)
                   - Una línea por archivo, con formato:
                     - [`path`](https://github.com/<owner>/<repo>/blob/HEAD/path#L<line>) (línea <line>)
                   - Archivos válidos en este repo: game.js, index.html, favicon.svg,
                     AGENTS.md, README.md.
                   - Omite archivos referenciados que no existan en el repo. Si se
                     menciona un archivo con número de línea (p.ej. game.js:120,
                     game.js#L120, game.js L120-130), incluye la línea en el link.
            4. Actualiza el cuerpo del issue con el cuerpo original + footer usando
               `update_issue`.
            5. Publica un comentario corto confirmando lo que hiciste.

            Restricciones:
              - NUNCA reescribas, reformatees, traduzcas ni borres el texto original.
              - Solo añade al final; nunca insertes secciones encima del cuerpo.
              - Si un heading del template ya existe en el body, omítelo (no duplicar).
              - No apliques labels que no matcheen las heurísticas de arriba.
              - Si dudas sobre una label, no la apliques.
